version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: myapp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: myappdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - myapp-network

  web:
    build: ./webapp
    container_name: myapp-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASS: apppass
      DB_NAME: myappdb
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - myapp-network

volumes:
  db_data:

networks:
  myapp-network:
